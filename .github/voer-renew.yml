# Voer.host 免费服务器自动续期
# 每次运行：先检查关机并重启，重启后再读可续期次数；
# 有剩余则连续续期（每轮 3 个激励广告 +4 小时）；
# 4 次已用完则跳过看广告，只做关机检查 + 重启。
#
# Secrets：VOER_SERVER_ID、VOER_TOKEN（必须）；TELEGRAM_*（可选）

name: Voer.host 会话续期

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式"
        required: true
        default: "renew"
        type: choice
        options:
          - renew      # 先重启（如关机）再看广告续期；4/4 则只检查关机重启
          - status     # 只查看当前状态，不消耗广告次数、不碰电源

  schedule:
    - cron: "0 0,8,16 * * *"   # 每天 00:00 / 08:00 / 16:00 UTC

concurrency:
  group: voer-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安装系统依赖（虚拟显示 + 字体）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb fonts-liberation libnss3 libatk-bridge2.0-0 \
            libgtk-3-0 libgbm1 libasound2t64 2>/dev/null || \
          sudo apt-get install -y -qq xvfb fonts-liberation libnss3 libatk-bridge2.0-0 \
            libgtk-3-0 libgbm1 libasound2

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 安装 Playwright Chromium
        run: |
          playwright install chromium --with-deps

      - name: 检查 Secrets 是否已配置
        env:
          VOER_SERVER_ID: ${{ secrets.VOER_SERVER_ID }}
          VOER_TOKEN: ${{ secrets.VOER_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$VOER_SERVER_ID" ] || [ -z "$VOER_TOKEN" ]; then
            echo "❌ 缺少 Secrets！"
            echo "请到仓库 Settings → Secrets and variables → Actions 添加："
            echo "  VOER_SERVER_ID = 你的服务器 UUID"
            echo "  VOER_TOKEN     = Cookie 里的 token（JWT）"
            exit 1
          fi
          echo "✅ 必要 Secrets 已配置"
          echo "  VOER_SERVER_ID 长度=${#VOER_SERVER_ID}, 开头=${VOER_SERVER_ID:0:8}..."
          echo "  VOER_TOKEN     长度=${#VOER_TOKEN}, 开头=${VOER_TOKEN:0:8}..."
          DOTS=$(echo -n "$VOER_TOKEN" | tr -cd '.' | wc -c)
          echo "  VOER_TOKEN 中 . 的数量=$DOTS（标准 JWT 应为 2）"
          if [[ ! "$VOER_TOKEN" == eyJ* ]]; then
            echo "⚠️  警告：正常 JWT 一般以 eyJ 开头，当前开头异常，可能复制错了"
          fi
          if [ "$DOTS" -ne 2 ]; then
            echo "⚠️  警告：标准 JWT 应有 2 个点（3 段），当前点数=$DOTS，可能复制不完整"
          fi
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "ℹ️  Telegram 未完整配置（将跳过 TG 通知）"
          else
            echo "✅ Telegram 已配置"
          fi

      - name: 只查看状态（不消耗广告）
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'status'
        env:
          VOER_SERVER_ID: ${{ secrets.VOER_SERVER_ID }}
          VOER_TOKEN: ${{ secrets.VOER_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          xvfb-run -a python3 voer_renew.py --status

      - name: 执行关机检查 / 重启 / 续期
        if: |
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'renew')
        env:
          VOER_SERVER_ID: ${{ secrets.VOER_SERVER_ID }}
          VOER_TOKEN: ${{ secrets.VOER_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VOER_AUTO_RESTART: "1"
          VOER_POWER_WAIT_SEC: "240"
        run: |
          echo "流程：关机检查 → 重启 → 读可续期次数 → 有剩余才看广告"
          xvfb-run -a python3 voer_renew.py
          echo "脚本执行完毕，请查看上方日志中的「可续期次数」"

      - name: 上传失败截图（如有）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshot
          path: |
            debug_screenshot*.png
            renew_screenshot*.png
          if-no-files-found: ignore

      - name: 续期后再次确认状态
        if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'renew'))
        env:
          VOER_SERVER_ID: ${{ secrets.VOER_SERVER_ID }}
          VOER_TOKEN: ${{ secrets.VOER_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "----- 当前服务器状态（含可续期次数）-----"
          xvfb-run -a python3 voer_renew.py --status || true
